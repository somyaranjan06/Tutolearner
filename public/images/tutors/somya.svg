<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgSomya" x1="0" y1="0" x2="400" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="mathAccent" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4338CA" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="400" rx="24" fill="url(#bgSomya)" />
  
  <!-- Subtle Geometry grid pattern -->
  <circle cx="200" cy="200" r="140" stroke="#334155" stroke-width="1.5" stroke-dasharray="6 6" />
  <circle cx="200" cy="200" r="100" stroke="#475569" stroke-width="1" />
  <line x1="60" y1="200" x2="340" y2="200" stroke="#334155" stroke-width="1" />
  <line x1="200" y1="60" x2="200" y2="340" stroke="#334155" stroke-width="1" />
  
  <!-- Avatar Silhouette / Monogram Art -->
  <circle cx="200" cy="160" r="64" fill="url(#mathAccent)" />
  <text x="200" y="176" font-family="system-ui, sans-serif" font-size="44" font-weight="700" fill="#FFFFFF" text-anchor="middle">SN</text>
  
  <!-- Body Silhouette -->
  <path d="M110 320 C110 250, 150 240, 200 240 C250 240, 290 250, 290 320" fill="#334155" />
  
  <!-- Subject Indicator Badge -->
  <rect x="100" y="340" width="200" height="36" rx="18" fill="#1E1B4B" stroke="#6366F1" stroke-width="1.5" />
  <text x="200" y="363" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#E0E7FF" text-anchor="middle">MATHS &amp; SCIENCE</text>
</svg>
