<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 1:1 Standardized Academic Portrait Frame -->
  <rect width="400" height="400" fill="#0F172A" />
  
  <!-- Subtle Gradient Depth -->
  <circle cx="200" cy="150" r="140" fill="#1E293B" />
  <circle cx="340" cy="60" r="100" fill="#312E81" fill-opacity="0.25" />
  <circle cx="60" cy="340" r="120" fill="#1E1B4B" fill-opacity="0.3" />
  
  <!-- Academic Silhouette Profile -->
  <circle cx="200" cy="140" r="54" fill="#334155" />
  <path d="M110 320C110 260 148 230 200 230C252 230 290 260 290 320V340H110V320Z" fill="#334155" />
  
  <!-- Faculty Monogram Badge -->
  <circle cx="200" cy="140" r="44" fill="#1E293B" stroke="#4F46E5" stroke-width="2.5" />
  <text x="200" y="152" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">SW</text>
  
  <!-- Lower Label Plaque -->
  <rect x="50" y="320" width="300" height="50" rx="10" fill="#020617" stroke="#334155" stroke-width="1.5" />
  <text x="200" y="342" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#F8FAFC" text-anchor="middle">SHIWANGI</text>
  <text x="200" y="358" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#818CF8" text-anchor="middle" letter-spacing="0.5">SOCIAL SCIENCE</text>
  
  <!-- Top Right Verified Marker -->
  <circle cx="350" cy="50" r="16" fill="#064E3B" stroke="#10B981" stroke-width="2" />
  <path d="M344 50L348 54L356 46" stroke="#34D399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
</svg>
